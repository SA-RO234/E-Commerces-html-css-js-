<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bag || Shop</title>
    <!-- link font awsome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/style/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="navbar">
        <div class="navbar-left">
          <button type="button" id="Menu">
            <img src="/assets/menu.png" alt="" />
          </button>
          <div class="line"></div>
          <a href="/ListCart.html"><img src="/assets/Buy.png" alt="" /></a>
          <span id="cartindex-QTY">0</span>
        </div>
        <div class="navList" id="navList">
          <div class="item" id="fetch-Winter">
            <img src="/assets/menuIcon/menu1.png" alt="" />
            <h1>Winter clothing</h1>
          </div>
          <div class="item" id="Trousers-jeans">
            <img src="/assets/menuIcon/menu2.png" alt="" />
            <h1>Trousers & jeans</h1>
          </div>
          <div class="item" id="Shoes-sandle">
            <img src="/assets/menuIcon/menu3.png" alt="" />
            <h1>Shoes & sandle</h1>
          </div>
          <div class="item" id="Hats-caps">
            <img src="/assets/menuIcon/menu4.png" alt="" />
            <h1>Hats & caps</h1>
          </div>
          <div class="item" id="Bags-purses">
            <img src="/assets/menuIcon/menu5.png" alt="" />
            <h1>Bags & purses</h1>
          </div>
          <div class="item" id="Ladies-Whatches">
            <img src="/assets/menuIcon/menu6.png" alt="" />
            <h1>Ladies Whatches</h1>
          </div>
        </div>
        <div class="nabar-right">
          <button type="button">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <button type="button">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
      </div>
      <div class="allproduct-container" id="AllListcard">
        <!--  All Product show as dynamic ! -->
      </div>
    </div>
    <!-- JS -->
    <script src="/js/ListCart.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
