<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List Cart</title>
    <link rel="stylesheet" href="/style/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <div class="container">
      
      <div class="navbar" id="navbar">
        
      </div>
      <h1 class="title">Your Product</h1>
      <div class="allList-Container">
        <div class="AllList" id="AllList">
          <!-- Show  All View cart , Shoping cart -->
        </div>
        <div class="detail">
          <h3>Invoice Detail</h3>
          <p>Date : <span id="dateNow"></span></p>
          <p>SubTotal : $<span>100.00</span></p>
          <p>Price Discount : $<span id="price">5.00</span></p>
          <p>Total Discount : <span id="totalDis">30</span>%</p>
          <p>Tax : $10.00</p>
          <h4>Total : $<span id="totalpay">400.00</span></h4>
        </div>
      </div>
    </div>
    <script src="/js/ListCart.js"></script>
    <script src="/js/app.js"></script>
    <script type="module" >
    import  Navbar  from "./components/navbar.js";
   document.querySelector("#navbar").innerHTML = Navbar();
</script>
  </body>
</html>
